name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run Stylelint
        run: npm run stylelint

      - name: Type check
        run: npm run typecheck

      - name: Build application
        env:
          # The verification build does not connect to Convex, but its client
          # validates that a public deployment URL exists during prerendering.
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
        run: npm run build
